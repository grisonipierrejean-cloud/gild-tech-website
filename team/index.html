<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Battle Card · GILD-TECH</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --accent:#E91E8C; --bg:#fafafa; --panel:#fff; --line:#ececef; --text:#0a0a0c; --text-2:#4a4a52; --muted:#93939d; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;}
  body{background:radial-gradient(ellipse at top,#fef6fa 0%,#fafafa 60%);color:var(--text);font-family:'Inter',-apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;padding:40px 28px;text-align:center;}
  .logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#b8186e);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin:0 auto 22px;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
  h1{font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.025em;margin:0 0 12px;}
  p.lead{color:var(--text-2);font-size:15px;line-height:1.55;margin:0 0 32px;}
  .lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  a.card{display:block;padding:24px 22px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-decoration:none;color:var(--text);box-shadow:0 1px 2px rgba(10,10,12,.04),0 8px 24px -12px rgba(10,10,12,.08);transition:transform .12s,border-color .12s,box-shadow .12s;}
  a.card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 4px 24px -8px rgba(233,30,140,.25);}
  a.card .flag{font-size:32px;margin-bottom:10px;display:block;}
  a.card .title{font-weight:700;font-size:15px;}
  a.card .sub{font-size:12px;color:var(--text-2);margin-top:4px;}
  .footer{margin-top:36px;font-size:11px;color:var(--muted);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">G</div>
    <div class="eyebrow">Sales Battle Card</div>
    <h1>Choisis ta langue · Pick your language</h1>
    <p class="lead">URLs prospects · pricing · flow démo · objections · comparatifs. Usage interne GILD-TECH uniquement.</p>
    <div class="lang-grid">
      <a class="card" href="/team/fr/">
        <span class="flag">🇫🇷</span>
        <div class="title">Français</div>
        <div class="sub">Pour Hervé · Cécile · PJ</div>
      </a>
      <a class="card" href="/team/en/">
        <span class="flag">🇬🇧</span>
        <div class="title">English</div>
        <div class="sub">For Jack · PJ</div>
      </a>
    </div>
    <div class="footer">Hervé · Jack · Cécile · PJ · Girlden LTD UK</div>
  </div>
</body>
</html>
