<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Villa vue mer · Koh Samui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..400&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{background:#0A0A0B;color:#ECE4D6;font-family:'Space Mono',ui-monospace,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:22px}
  .k{color:#C79A5B;font-size:.64rem;letter-spacing:.3em;text-transform:uppercase}
  h1{font-family:'Fraunces',serif;font-weight:330;font-size:clamp(1.5rem,4vw,2.4rem);letter-spacing:-.02em;text-align:center}
  h1 em{font-style:italic;color:#C79A5B}
  .stage{width:min(100%,1000px);aspect-ratio:16/9;background:#000;border:1px solid #241F1C;overflow:hidden;box-shadow:0 30px 80px -30px #000}
  video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .row a{color:#A79B88;text-decoration:none;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
    border:1px solid #241F1C;border-radius:100px;padding:11px 18px;transition:.25s;cursor:pointer}
  .row a:hover,.row a.on{color:#0A0A0B;background:#ECE4D6;border-color:#ECE4D6}
  .foot{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#6E665A}
</style>
</head>
<body>
  <div class="k">Koh Samui · Villa contemporaine vue mer</div>
  <h1>Une villa, <em>en mouvement</em></h1>
  <div class="stage"><video id="v" src="maquette-16x9.mp4" controls autoplay muted loop playsinline preload="auto"></video></div>
  <div class="row">
    <a id="b1" class="on" data-src="maquette-16x9.mp4">Tour complet · 16:9</a>
    <a id="b2" data-src="maquette-12s.mp4">Version courte · 12s</a>
  </div>
  <div class="foot">Images non contractuelles · démo</div>
<script>
  var v=document.getElementById('v');
  document.querySelectorAll('.row a').forEach(function(a){
    a.addEventListener('click',function(){
      document.querySelectorAll('.row a').forEach(function(x){x.classList.remove('on')});
      a.classList.add('on'); v.src=a.dataset.src; v.play();
    });
  });
</script>
</body>
</html>
